<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F5EFE6"/>
      <stop offset="1" stop-color="#FFF9F2"/>
    </linearGradient>
    <linearGradient id="tone" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#D39A69"/>
      <stop offset="1" stop-color="#A9683E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#2B1B12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="420" cy="900" r="290" fill="#E79A57" opacity="0.12"/>
  <circle cx="1220" cy="280" r="220" fill="#E79A57" opacity="0.16"/>

  <g filter="url(#shadow)">
    <rect x="500" y="300" width="600" height="700" rx="72" fill="#FFFFFF" stroke="#2B1B12" stroke-opacity="0.14"/>
    <circle cx="800" cy="630" r="220" fill="url(#tone)"/>
    <circle cx="800" cy="630" r="220" fill="none" stroke="#2B1B12" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="640" y="880" width="320" height="16" rx="8" fill="#E79A57" opacity="0.75"/>
  </g>

  <g fill="#2B1B12">
    <text x="560" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="5" opacity="0.7">BRONZER TONE</text>
    <text x="560" y="940" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="4">Powder</text>
    <text x="560" y="982" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" opacity="0.7">Casa Kilicé</text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F5EFE6"/>
      <stop offset="1" stop-color="#FFF7EF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F2B37A"/>
      <stop offset="1" stop-color="#E79A57"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#2B1B12" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>

  <g opacity="0.24">
    <circle cx="360" cy="300" r="220" fill="url(#amber)"/>
    <circle cx="1280" cy="900" r="260" fill="url(#amber)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="260" width="360" height="620" rx="48" fill="#FFFFFF" stroke="#2B1B12" stroke-opacity="0.14"/>
    <rect x="420" y="220" width="240" height="90" rx="34" fill="#FFFFFF" stroke="#2B1B12" stroke-opacity="0.14"/>
    <rect x="840" y="340" width="420" height="540" rx="56" fill="#FFFFFF" stroke="#2B1B12" stroke-opacity="0.14"/>
    <rect x="920" y="280" width="260" height="120" rx="40" fill="#FFFFFF" stroke="#2B1B12" stroke-opacity="0.14"/>
  </g>

  <g fill="#2B1B12">
    <text x="430" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="4">Casa Kilicé</text>
    <text x="430" y="565" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" opacity="0.7">PACKAGING</text>

    <text x="920" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="4">Duo Set</text>
    <text x="920" y="668" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4" opacity="0.7">CREAM " POWDER</text>
  </g>

  <rect x="420" y="730" width="240" height="10" rx="5" fill="url(#amber)" opacity="0.65"/>
  <rect x="920" y="770" width="260" height="10" rx="5" fill="url(#amber)" opacity="0.65"/>
</svg>

